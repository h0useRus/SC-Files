BitZeros_blackbox_Intro_Title_001=Data Transfer <EM4>[BP]</EM4>
BitZeros_blackbox_Intro_Desc_001=Who we are and what we do is not important. All you gotta know is that we need things to get done and we pay people to do it.\n\nIf everything goes well, we don’t ever have to meet. Doesn’t that sound good?\n\nGot a good one to start you off, nice and simple. There’s a blackbox from a downed ship at <EM4>~mission(Location|Address)</EM4> that we want.\n\nAll you have to do is take it to <EM4>~mission(Destination|Target|Address)</EM4> and you get paid. Easy right? Watch out for scavs, you never know what kind of weirdos are hanging around these abandoned ships.\n\n-Bit Zeros\n<EM4>Potential Blueprints</EM4>\n - Lumin V SMG\n - Arrowhead Sniper Rifle\n - Aves Arms\n - Aves Core\n - Aves Legs\n - Aves Helmet\n - Aves Shrike Core\n - Aves Shrike Arms\n - Aves Shrike Legs\n - Aves Shrike Helmet\n - Lumin V SMG Battery (45 cap)\n - Arrowhead Sniper Rifle Battery (16 cap)\n
BitZeros_blackbox_S_Desc_001=Got a big job for a big player. We’re in the process of making someone disappear, like completely vanish, and a part of that is recovering the blackbox from the “accident” that they had recently over at <EM4>~mission(Location|Address)</EM4>.\nOnly problem is, seems the people this person hired to stage the accident have gotten it in their heads that there’s more money to be made. So much so that they’re still keeping tabs on the now deceased’s ship.\nThese guys aren’t playing around either. You’ll need a couple of friends to help you do this. But if you can get the blackbox out of there and into our hands by dropping it at <EM4>~mission(Destination|Target|Address)</EM4>, we can really make it worth your while.\n\n-Bit Zeros\n<EM4>Potential Blueprints</EM4>\n - Lumin V SMG\n - Arrowhead Sniper Rifle\n - Aves Arms\n - Aves Core\n - Aves Legs\n - Aves Helmet\n - Aves Shrike Core\n - Aves Shrike Arms\n - Aves Shrike Legs\n - Aves Shrike Helmet\n - Lumin V SMG Battery (45 cap)\n - Arrowhead Sniper Rifle Battery (16 cap)\n
BitZeros_blackbox_S_Title_001=Bad at Goodbyes <EM4>[BP]</EM4>
BitZeros_blackbox_E_Desc_001=So we were expecting a pretty important package earlier today but turns out the pilot got ghosted and they ripped the tracking chip from it and got away. Pretty clever right? Not really, because they forgot to take the flight recorder too.\n\nGet the blackbox from the wreck at <EM4>~mission(Location|Address)</EM4> and take it to <EM4>~mission(Destination|Target|Address)</EM4>. We’ll send you the creds when you’re done.\n\nOh and watch out for scavs, people are pretty desperate these days, even if it just some busted courier ship.\n\n-Bit Zeros\n<EM4>Potential Blueprints</EM4>\n - Lumin V SMG\n - Arrowhead Sniper Rifle\n - Aves Arms\n - Aves Core\n - Aves Legs\n - Aves Helmet\n - Aves Shrike Core\n - Aves Shrike Arms\n - Aves Shrike Legs\n - Aves Shrike Helmet\n - Lumin V SMG Battery (45 cap)\n - Arrowhead Sniper Rifle Battery (16 cap)\n
BitZeros_blackbox_E_Title_001=Getting To the Bottom of It <EM4>[BP]</EM4>
BitZeros_blackbox_H_Desc_001=Don’t know if you’ve heard, but there’s a bunch of ships over at <EM4>~mission(location|Address)</EM4> surrounding a burnt-out ship. You curious why? I know we are.\nThink you can get in that wreck, grab the blackbox, and get out? We’ll pay you for it.\n\nBased on the number of sketchy ships in the area, you should bring some friends with to watch your ass, unless you’re some crazy solo act, but we’d prefer if you actually survived this so you can drop off the blackbox at <EM4>~mission(Destination|Target|Address)</EM4> for us. \n\nBut hey, your call. As long as it gets done.\n\n-Bit Zeros\n<EM4>Potential Blueprints</EM4>\n - Lumin V SMG\n - Arrowhead Sniper Rifle\n - Aves Arms\n - Aves Core\n - Aves Legs\n - Aves Helmet\n - Aves Shrike Core\n - Aves Shrike Arms\n - Aves Shrike Legs\n - Aves Shrike Helmet\n - Lumin V SMG Battery (45 cap)\n - Arrowhead Sniper Rifle Battery (16 cap)\n
BitZeros_blackbox_H_Title_001=Legendary Info? <EM4>[BP]</EM4>
BitZeros_blackbox_VE_Desc_001=Someone of interest to us recently kicked the bucket (not our fault) over at <EM4>~mission(Location|Address)</EM4> and we’re pretty curious what happened. We need you to grab the blackbox from the ship and drop it off at <EM4>~mission(Destination|Target|Address)</EM4>.\n\nThis is a shipwreck by the way, so chances are some scavs will be around there too. But don’t worry, that’s been factored into your pay too.\n\n-Bit Zeros\n<EM4>Potential Blueprints</EM4>\n - Lumin V SMG\n - Arrowhead Sniper Rifle\n - Aves Arms\n - Aves Core\n - Aves Legs\n - Aves Helmet\n - Aves Shrike Core\n - Aves Shrike Arms\n - Aves Shrike Legs\n - Aves Shrike Helmet\n - Lumin V SMG Battery (45 cap)\n - Arrowhead Sniper Rifle Battery (16 cap)\n
BitZeros_blackbox_VE_Title_001=Pick Up, Put Down <EM4>[BP]</EM4>
BitZeros_blackbox_VH_Desc_001=I’m not gonna give you the whole backstory of what this person has done to us, but all you need to know is that some scumbag is trying to get a payout for a ship crash and the insurance company wants to see the blackbox recording to make sure everything is “above board”.\n\nWe’re not gonna let that happen though.\n\nSnatch that blackbox at <EM4>~mission(Location|Address)</EM4> and bring it to us instead so we can do some “creative editing” on the recording.\n\nApparently, this area is a bit of a hot zone. Probably why they staged the accident there. You should probably bring some backup so you don’t get ghosted before you can bring the blackbox to us at <EM4>~mission(Destination|Target|Address)</EM4>.\n\n-Bit Zeros\n<EM4>Potential Blueprints</EM4>\n - Lumin V SMG\n - Arrowhead Sniper Rifle\n - Aves Arms\n - Aves Core\n - Aves Legs\n - Aves Helmet\n - Aves Shrike Core\n - Aves Shrike Arms\n - Aves Shrike Legs\n - Aves Shrike Helmet\n - Lumin V SMG Battery (45 cap)\n - Arrowhead Sniper Rifle Battery (16 cap)\n
BitZeros_blackbox_VH_Title_001=Our Version of The Truth <EM4>[BP]</EM4>
BitZeros_blackbox_M_Desc_001=We were a little too smart with this one and it’s kinda backfired. Sometimes you gotta dream big, you know? Anyway. we were looking to move some encrypted data to one of our data havens and decided to hide it in a ship’s blackbox. They filled the ship with “valuable” stuff as a decoy in case it got attacked. The plan worked a little too well and the cargo might have attracted the wrong kind of attention. They stole all the cargo but missed the blackbox. Bad news is the ship is now swarming with outlaws.\n\nThe data on that blackbox is useless to them, but we need it. If you can get it back for us, we can give you a nice cut from what we make. Seems like a fair deal, right?\n\nHead to <EM4>~mission(Location|Address)</EM4> and after you’ve done your thing take the flight recorder to <EM4>~mission(Destination|Target|Address)</EM4>.\n\n-Bit Zeros\n<EM4>Potential Blueprints</EM4>\n - Lumin V SMG\n - Arrowhead Sniper Rifle\n - Aves Arms\n - Aves Core\n - Aves Legs\n - Aves Helmet\n - Aves Shrike Core\n - Aves Shrike Arms\n - Aves Shrike Legs\n - Aves Shrike Helmet\n - Lumin V SMG Battery (45 cap)\n - Arrowhead Sniper Rifle Battery (16 cap)\n
BitZeros_blackbox_M_Title_001=Too Smart For Our Own Good <EM4>[BP]</EM4>

Journal_General_Mining_Compendium_Content=To promote the entrepreneurial spirit of the modern miner, the United Resource Workers have put together a handy guide listing the most common locations to find minerals, ores, and gemstones across the ‘verse.\n\n** Legendary **\nQuantainium (3170/6340) - Found in All Deposits\nSavrilium (3200/6400) - Glaciem Ring, QV Breaker Stations (Nyx)\nStileron (3185/6370) - Found in All Pyro Deposits\n\n** Epic **\nLindinium (3400/6800/10200) - Glaciem Ring\nOuratite (3370/6740/10110) - Hurston, Arial, Aberdeen, Cellin, Yela's Ring\nRiccite (3385/6770/10155) - Found in All Pyro Deposits\n\n** Rare **\nBeryl (7080/10620/14160) - Found in All Deposits\nBexalite (7200/10800/14400) - Found in All Deposits\nBorase (7140/10710/14280) - Found in All Deposits\nGold (7170/10755/14340) - Found in All Deposits\nTaranite (7110/10665/14220) - Found in All Deposits\n\n** Uncommon **\nAgricium (11655/15540/19425) - Found in All Deposits\nAslarite (11520/15360/19200) - Aaron Halo, Magda, Ita, Pyro Asteroid Clusters, Fuego, Vuur\nLaranite (11475/15300/19125) - Found in All Deposits\nTitanium (11565/15420/19275) - Aaron Halo, Cellin, Daymar, Yela, Stanton Lagrange Points, Pyro Asteroid Clusters, Aberdeen, Magda, Terminus\nTorite (11700/15600/19500) - Glaciem Ring, QV Breaker Stations (Nyx)\nTungsten (11610/15480/19425) - Aaron Halo, Lyria, Wala, CRU-L1, CRU-L2, CRU-L5, ARC-L3, MIC-L4, HUR-L3, Adir, Fairo\n\n** Common **\nAluminium (17140/21425/25710) - Aaron Halo, Hurston, Arial, Aberdeen, Magda, Cellin, Yela, Ita, Stanton Lagrange Points, Pyro Asteroid Clusters\nCopper (16960/21200/25440) - Aaron Halo, Aberdeen, Daymar, Stanton Lagrange Points, Pyro Asteroid Clusters, Lyria, Clio, Euterpe, Pyro I, Pyro IV, Terminus\nCorundum (16900/21125/25350) - Aaron Halo, Calliope, Clio, Euterpe, Arial, Lyria, microTech, Pyro Asteroid Clusters\nHephaestanite aka Heph (16720/20900/25080) - Found in All Deposits\nIce (17200/21500/25800) - Outer Pyro Asteroids, microTech, Calliope, Clio, Euterpe, Terminus\nIron (17080/21350/25620) - Aaron Halo, Aberdeen, Arial, Daymar, Ita, Magda, Stanton Lagrange Points, Pyro Asteroid Clusters, Lyria, Wala, microTech, Calliope, Pyro I, Monox, Vatra, Adir, Terminus\nQuartz (16840/21050/25260) - Aaron Halo, Aberdeen, Ariel, Calliope, Clio, Euterpe, Lyria, microTech, CRU-L5, ARC-L3, MIC-L4, Pyro Asteroid Clusters, Cellin, Daymar, Yela, Bloom\nSilicon (17020/21350/25620) - Inner Pyro Asteroids, Daymar, Yela, Ignis, Vatra, Fairo\nTin (16780/20975/25260) - Pyro III, Pyro IV, Hurston, Arial, Ita, Pyro I, Monox, Ignis\n\n** Hand Mineables **\nAphorite - All Moons/Planets/Caves\nBeradon - Pyro I, Bloom (Pyro III)\nCaranite - Aberdeen, Daymar\nDolivine - All Moons/Planets/Caves\nFeynmaline - Pyro IV\nGlacosite - Monox (Pyro II)\nHadanite - All Moons/Planets/Caves\nJanalite - Daymar, Hurston, Ita, Magda Sand Caves, Wala, Lyria, microTech, Calliope, Clio, Euterpe, Bloom, Fuego, Terminus\nJanalite (Caves only) - Hurston, Arial, Aberdeen, Magda, Ita, Cellin, Daymar, Pyro I, Monox, Pyro IV, Ignis, Vatra, Adir, Fairo, Vuur\nSadaryx - QV Breaker Stations (Nyx)\n\n** Harvestable **\nAmiant Pod - Bloom (Pyro III)\nAmioshi Plague - All Moons/Planets (Caves)\nArmillaria - All Moons/Planets (Caves)\nCompboard - Hurston\nDecari Pod - Pyro I\nDegnous Root - Hurston\nFlareweed Stalk - Bloom (Pyro III)\nFotia Seedpod - Pyro I\nGolden Medmon - Hurston, microTech\nHeart of the Woods - microTech\nPingala Seeds - Monox (Pyro II)\nPitambu - Hurston, microTech\nProta - Hurston\nRanta Dung - All Moons/Planets (Caves)\nRevenant Pod - Hurston\nStone Bug Shell - Daymar (Caves)\nSunset Berry - microTech\nWuotan Seeds - Pyro I\n
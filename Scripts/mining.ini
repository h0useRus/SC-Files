Journal_General_Mining_Compendium_Content=To promote the entrepreneurial spirit of the modern miner, the United Resource Workers have put together a handy guide listing the most common locations to find minerals, ores, and gemstones across the ‘verse.\n** Legendary **\nQuantainium (3170/6340) - Found in All Deposits\nSavrilium (3200/6400) - Glaciem Ring, QV Breaker Stations (Nyx)\nStileron (3185/6370) - Found in All Pyro Deposits\n\n** Epic **\nLindinium (3400/6800/10200) - Glaciem Ring\nOuratite (3370/6740/10110) - Hurston, Aberdeen, Cellin, Yela's Ring\nRiccite (3385/6770/10155) - Found in All Pyro Deposits\n\n** Rare **\nBeryl (7080/10620/14160) - Found in All Deposits\nBexalite (7200/10800/14400) - Found in All Deposits\nBorase (7140/10710/14280) - Found in All Deposits\nGold (7170/10755/14340) - Found in All Deposits\nTaranite (7110/10665/14220) - Found in All Deposits\n\n** Uncommon **\nAgricium (11655/15540/19425) - Found in All Deposits\nAslarite (11520/15360/19200) - Aaron Halo, Magda, Ita, Pyro Asteroid Clusters, Fuego, Vuur\nLaranite (11475/15300/19125) - Found in All Deposits\nTitanium (11565/15420/19275) - Aaron Halo, Cellin, Daymar, Yela, Stanton Lagrange Points, Pyro Asteroid Clusters\nTorite (11700/15600/19500) - Glaciem Ring, QV Breaker Stations (Nyx)\nTungsten (11610/15480/19425) - Aaron Halo, Lyria, Wala, CRU-L1, CRU-L2, CRU-L5, ARC-L3, MIC-L4, HUR-L3\n\n** Common **\nAluminium (17140/21425/25710) - Aaron Halo, Cellin, Yela, Stanton Lagrange Points, Pyro Asteroid Clusters\nCopper (16960/21200/25440) - Aaron Halo, Aberdeen, Daymar, Stanton Lagrange Points, Pyro Asteroid Clusters\nCorundum (16900/21125/25350) - Aaron Halo, Calliope, Clio, Euterpe, Lyria, microTech, Pyro Asteroid Clusters\nHephaestanite aka Heph (16720/20900/25080) - Found in All Deposits\nIce (17200/21500/25800) - Outer Pyro Asteroids\nIron - Aaron Halo, Aberdeen, Arial, Daymar, Ita, Magda, Stanton Lagrange Points, Pyro Asteroid Clusters\nQuartz (16840/21050/25260) - Aaron Halo, Aberdeen, Ariel, Calliope, Clio, Euterpe, Lyria, microTech, CRU-L5, ARC-L3, MIC-L4, Pyro Asteroid Clusters\nSilicon (17020/21350/25620) - Inner Pyro Asteroids\nTin (16780/20975/25260) - Pyro III, Pyro IV\n\n** Hand Mineables **\nAphorite - All Moons/Planets/Caves\nBeradon - Pyro I, Bloom\nCaranite - Aberdeen, Daymar\nDolivine - All Moons/Planets/Caves\nFeynmaline - Pyro IV\nGlacosite - Monox\nHadanite - All Moons/Planets/Caves\nJanalite - Daymar, Hurston, Ita, Magda Sand Caves, Wala\nSadaryx - QV Breaker Stations (Nyx)